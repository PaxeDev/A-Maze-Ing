[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator"
readme = "mazegen/README.md"
requires-python = "==3.14.*"
license = "MIT"
license-files = ["LICENSE.md"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "flake8==7.4.*",
    "mypy==2.4.*",
	"pydantic==2.13.*",
    "pytest==9.1.*",
]